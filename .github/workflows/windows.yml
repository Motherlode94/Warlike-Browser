name: WarLike Browser Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'browser-v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify browser code
        run: npm run check
      - name: Build Windows installer and portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload unsigned Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: WarLike-Browser-Windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
